name: Fork hygiene

on:
  pull_request:
    branches: [macos-kosmickrisp, main]
  push:
    branches: [macos-kosmickrisp]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run macOS fork hygiene gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="origin/main"
            git fetch origin main --depth=50 || BASE="HEAD~1"
          fi
          python3 scripts/preflight_macos.py --check-hygiene --ci --base "$BASE"
