name: Fork hygiene

on:
  pull_request:
    branches: [macos-kosmickrisp, main]
  push:
    branches: [macos-kosmickrisp]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Run macOS fork hygiene gate
        run: |
          FRESHNESS_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE="$BEFORE"
            elif git rev-parse --verify --quiet origin/main >/dev/null && [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              BASE="origin/main"
            else
              echo "ERROR: cannot determine push base commit (before=${BEFORE}); refusing to fall back to HEAD~1" >&2
              exit 1
            fi
            if git rev-parse --verify --quiet origin/main >/dev/null; then
              FRESHNESS_ARGS="--freshness-base origin/main"
            fi
          fi
          python3 scripts/preflight_macos.py --check-hygiene --ci --base "$BASE" $FRESHNESS_ARGS
